services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docusage_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docusage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docusage_secret}
      POSTGRES_DB: ${POSTGRES_DB:-docusage_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docusage} -d ${POSTGRES_DB:-docusage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
